name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: python -m unittest discover -s tests
      - run: node --test
        working-directory: worker
      - run: sha256sum eval_store.py worker/worker.js > SHA256SUMS
      - run: gh release create "$GITHUB_REF_NAME" eval_store.py worker/worker.js SHA256SUMS --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
